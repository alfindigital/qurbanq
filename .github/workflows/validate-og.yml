name: Validate OG Images

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate og:image declarations
        run: npm run validate:og

  e2e-social:
    runs-on: ubuntu-latest
    needs: validate-og
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run social meta e2e tests
        run: npm run test:e2e:social

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-social
          path: playwright-report/
          retention-days: 7
