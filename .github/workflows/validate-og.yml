name: Validate OG Images

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate og:image declarations
        run: npm run validate:og
